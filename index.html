<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>SCPタグ翻訳ツール</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* ベーススタイル */
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        line-height: 1.4;
        background-color: #f8f8f8;
        color: #333;
      }

      header {
        padding: 1rem;
        background-color: #f0f0f0;
        border-bottom: 1px solid #ccc;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
      }

      .container {
        width: 100%;
        max-width: 900px; /* ログ領域のはみ出しを防止 */
        margin: 0 auto;
        display: flex;
        flex-direction: row;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
      }

      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0; /* フレックス縮小時に要素がはみ出さないように */
      }

      label {
        font-weight: bold;
      }

      select {
        padding: 0.25rem;
        font-size: 0.9rem;
      }

      textarea {
        width: 100%;
        height: 8rem;
        box-sizing: border-box;
        resize: vertical;
        font-family: monospace;
        font-size: 0.95rem;
        padding: 0.5rem;
      }

      .buttons {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0.5rem 0;
      }

      .button {
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f0f0f0;
      }

      /* ログ表示欄 */
      #logArea {
        width: 100%;
        height: 6rem;
        border: 1px solid #ccc;
        padding: 0.5rem;
        white-space: pre-wrap;
        overflow-y: auto;
        background-color: #f7f7f7;
        color: #444;
        box-sizing: border-box;
      }

      /* ローディング表示（テキスト＋アニメーション） */
      #loadingIndicator {
        display: none; /* 初期は非表示 */
        font-size: 0.95rem;
        color: #333;
        margin-top: 0.5rem;
        align-items: center;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid #ccc;
        border-top: 3px solid #66a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* ダークモード */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #222;
          color: #eee;
        }
        header,
        .container {
          background-color: #333;
        }
        select,
        textarea {
          background-color: #555;
          color: #eee;
          border: 1px solid #aaa;
        }
        .button {
          background-color: #444;
          color: #eee;
          border: 1px solid #aaa;
        }
        #logArea {
          background-color: #444;
          color: #ccc;
        }
        #loadingIndicator {
          color: #ccc;
        }
        .spinner {
          border: 3px solid #aaa;
          border-top: 3px solid #fff;
        }
      }

      /* 画面幅が狭い場合: 縦配置に切り替え */
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SCPタグ翻訳ツール</h1>
    </header>

    <!-- メインの2カラム: 翻訳元 / 翻訳先 -->
    <div class="container">
      <div class="column">
        <label for="sourceLang">翻訳元言語</label>
        <select id="sourceLang">
          <!-- 今は英語(en)のみ対応 -->
          <option value="en" selected>English (en)</option>
          <!-- 将来的には以下を追加（コメントアウト中）
        <option value="cn">中文 (cn)</option>
        <option value="cs">Česky (cs)</option>
        <option value="de">Deutsch (de)</option>
        <option value="es">Español (es)</option>
        <option value="fr">Français (fr)</option>
        <option value="it">Italiano (it)</option>
        <option value="jp">日本語 (jp)</option>
        <option value="ko">한국어 (ko)</option>
        <option value="pl">Polski (pl)</option>
        <option value="pt">Português (pt)</option>
        <option value="ru">Русский (ru)</option>
        <option value="th">ภาษาไทย (th)</option>
        <option value="ua">Українська (ua)</option>
        <option value="vn">Tiếng Việt (vn)</option>
        <option value="zh">繁體中文 (zh)</option>
        --></select>

        <textarea id="sourceText" placeholder="翻訳したいタグを入力"></textarea>
      </div>

      <div class="column">
        <label for="targetLang">翻訳先言語</label>
        <select id="targetLang">
          <!-- 今は日本語(jp)のみ対応 -->
          <option value="jp" selected>日本語 (jp)</option>
          <!-- 将来的には以下を追加（コメントアウト中）
        <option value="en">English (en)</option>
        <option value="cn">中文 (cn)</option>
        <option value="cs">Česky (cs)</option>
        <option value="de">Deutsch (de)</option>
        <option value="es">Español (es)</option>
        <option value="fr">Français (fr)</option>
        <option value="it">Italiano (it)</option>
        <option value="ko">한국어 (ko)</option>
        <option value="pl">Polski (pl)</option>
        <option value="pt">Português (pt)</option>
        <option value="ru">Русский (ru)</option>
        <option value="th">ภาษาไทย (th)</option>
        <option value="ua">Українська (ua)</option>
        <option value="vn">Tiếng Việt (vn)</option>
        <option value="zh">繁體中文 (zh)</option>
        --></select>

        <textarea
          id="targetText"
          readonly
          placeholder="翻訳結果が表示されます"
        ></textarea>

        <div class="buttons">
          <!-- コピー ボタン -->
          <button class="button" id="btnCopy">コピー</button>
        </div>
      </div>
    </div>

    <!-- ログ表示欄 -->
    <div class="container" style="flex-direction: column">
      <div class="column">
        <label>ログ</label>
        <div id="logArea" aria-readonly="true"></div>

        <!-- ローディング表示エリア -->
        <div id="loadingIndicator">
          <div class="spinner"></div>
          <span>辞書を読み込んでいます...</span>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      // 対応可能な言語支部タグ一覧
      const recognizedLangs = [
        "cn",
        "cs",
        "de",
        "en",
        "es",
        "fr",
        "it",
        "jp",
        "ko",
        "pl",
        "pt",
        "ru",
        "th",
        "ua",
        "vn",
        "zh",
      ];

      const dictionaryCache = {}; // ペアごとの辞書キャッシュ
      const deprecatedCache = {}; // 非使用タグ置換辞書のキャッシュ
      let translationRequestId = 0; // 非同期fetchの古い結果を無視するための連番
      const loadingIndicator = document.getElementById("loadingIndicator");
      const hasOwn = (object, key) =>
        Object.prototype.hasOwnProperty.call(object, key);

      window.addEventListener("DOMContentLoaded", () => {
        setupUI();
        doTranslate(); // ページ読み込み時に1度実行
      });

      function setupUI() {
        document
          .getElementById("sourceLang")
          .addEventListener("change", doTranslate);
        document
          .getElementById("targetLang")
          .addEventListener("change", doTranslate);
        document
          .getElementById("sourceText")
          .addEventListener("input", doTranslate);
        document
          .getElementById("btnCopy")
          .addEventListener("click", copyResult);
      }

      /**
       * メインの翻訳処理
       */
      function doTranslate() {
        const requestId = ++translationRequestId;
        clearLog();
        showLoading(true);

        const srcLang = document.getElementById("sourceLang").value;
        const tgtLang = document.getElementById("targetLang").value;
        const mapKey = `${srcLang}_to_${tgtLang}`;
        const inputStr = document.getElementById("sourceText").value.trim();

        if (!inputStr) {
          // 入力が空のときは翻訳結果をクリアし、ローディング非表示
          document.getElementById("targetText").value = "";
          showLoading(false);
          return;
        }

        // 非使用タグ置換辞書のfetch（キャッシュ済みでなければ）
        const deprecatedKey = `${mapKey}_deprecated`;
        const deprecatedUrl = `./dictionaries/deprecated_${mapKey}.json`;
        const deprecatedPromise = deprecatedCache[deprecatedKey]
          ? Promise.resolve(deprecatedCache[deprecatedKey])
          : fetch(deprecatedUrl)
              .then((res) => (res.ok ? res.json() : {}))
              .then((data) => {
                deprecatedCache[deprecatedKey] = data;
                return data;
              })
              .catch(() => {
                deprecatedCache[deprecatedKey] = {};
                return {};
              });

        // すでに読み込み済みかどうか
        if (dictionaryCache[mapKey]) {
          deprecatedPromise.then((deprecated) => {
            if (requestId !== translationRequestId) {
              return;
            }
            doTranslationWithDictionary(
              dictionaryCache[mapKey],
              inputStr,
              srcLang,
              deprecated
            );
            showLoading(false);
          });
        } else {
          // 辞書ファイルをfetch
          const url = `./dictionaries/${mapKey}.json`;
          Promise.all([
            fetch(url)
              .then((res) => {
                if (!res.ok) {
                  throw new Error(`辞書ファイルがありません (${mapKey}.json)`);
                }
                return res.json();
              }),
            deprecatedPromise,
          ])
            .then(([data, deprecated]) => {
              if (requestId !== translationRequestId) {
                return;
              }
              dictionaryCache[mapKey] = data;
              doTranslationWithDictionary(data, inputStr, srcLang, deprecated);
            })
            .catch((err) => {
              if (requestId !== translationRequestId) {
                return;
              }
              const localFileNote =
                window.location.protocol === "file:"
                  ? "\nローカルファイルからはブラウザ制限により辞書JSONを読み込めません。GitHub PagesまたはローカルHTTPサーバーで開いてください。"
                  : "";
              setLog(
                `【エラー】未対応ペア (${mapKey}) です。辞書ファイル読み込みに失敗。${localFileNote}`
              );
              console.error(err);
              document.getElementById("targetText").value = "";
            })
            .finally(() => {
              if (requestId === translationRequestId) {
                showLoading(false);
              }
            });
        }
      }

      /**
       * 辞書データで実際の翻訳を行う
       * @param {object} dictionary - 翻訳用辞書
       * @param {string} inputStr - ユーザー入力（タグ文字列）
       * @param {string} srcLang - 翻訳元言語
       * @param {object} deprecatedDict - 非使用タグ置換辞書（省略可）
       */
      function doTranslationWithDictionary(dictionary, inputStr, srcLang, deprecatedDict) {
        // 入力を空白で分割して個別のタグに
        const tokens = inputStr.split(/\s+/);
        let allTags = [];

        // 各タグを処理
        tokens.forEach((token) => {
          // 単一のタグとして辞書に存在するかチェック
          if (hasOwn(dictionary, token)) {
            // 単一のタグとして存在する場合はそのまま追加
            allTags.push(token);
          } else {
            // 存在しない場合は複合タグとして分割処理
            const splitted = splitConcatenatedTags(token, dictionary);
            allTags = allTags.concat(splitted);
          }
        });

        const translatedList = [];
        const replacedList = [];
        const skippedList = [];
        const appendTranslatedTag = (tag) => {
          if (!translatedList.includes(tag)) {
            translatedList.push(tag);
          }
        };

        allTags.forEach((tag) => {
          if (!hasOwn(dictionary, tag)) {
            skippedList.push(`${tag} (未定義)`);
          } else if (dictionary[tag] === null) {
            const replacement = deprecatedDict && deprecatedDict[tag];
            if (replacement) {
              // 置換先があれば翻訳結果に追加してログに記録
              appendTranslatedTag(replacement);
              replacedList.push(`${tag} → ${replacement}`);
            } else {
              // 置換先なし：非使用タグとしてスキップ
              skippedList.push(`${tag} (非使用タグ)`);
            }
          } else {
            appendTranslatedTag(dictionary[tag]);
          }
        });

        // ---- 支部タグの追加（翻訳元言語をタグに含める）----
        // 例: srcLang="en" なら "en" を出力に追加
        if (translatedList.length > 0 && recognizedLangs.includes(srcLang)) {
          // 二重に入るのを避けたいなら、以下のように重複チェックをする
          if (!translatedList.includes(srcLang)) {
            // 先頭に追加
            translatedList.unshift(srcLang);
          }
        }

        // 結果をテキストエリアに表示
        document.getElementById("targetText").value = translatedList.join(" ");

        // ログ表示
        const logParts = [];
        if (replacedList.length > 0) {
          logParts.push(
            "【注意】以下のタグは置換されました：\n" + replacedList.join("\n")
          );
        }
        if (skippedList.length > 0) {
          logParts.push(
            "【注意】以下のタグはスキップされました：\n" + skippedList.join("\n")
          );
        }
        if (logParts.length > 0) {
          setLog(logParts.join("\n\n"));
        }
      }

      /**
       * 連結タグの最長一致分割
       */
      function splitConcatenatedTags(token, dictionary) {
        // 辞書キーをチェックしやすいようにセットに変換
        const dictKeys = Object.keys(dictionary);
        const dictKeySet = new Set(dictKeys);
        const maxKeyLength = dictKeys.reduce(
          (max, key) => Math.max(max, key.length),
          0
        );

        // 各位置で最長の辞書タグを優先しつつ、末尾まで分割できる候補を選ぶ
        const canSplit = Array(token.length + 1).fill(false);
        const nextEndByIndex = Array(token.length + 1).fill(-1);
        canSplit[token.length] = true;

        for (let index = token.length - 1; index >= 0; index--) {
          const maxEnd = Math.min(token.length, index + maxKeyLength);
          for (let end = maxEnd; end > index; end--) {
            const segment = token.substring(index, end);
            if (!dictKeySet.has(segment)) {
              continue;
            }

            if (canSplit[end]) {
              canSplit[index] = true;
              nextEndByIndex[index] = end;
              break;
            }
          }
        }

        // 分割できない場合は元のトークンをそのまま返す
        if (!canSplit[0]) {
          return [token];
        }

        const result = [];
        for (let index = 0; index < token.length; ) {
          const nextEnd = nextEndByIndex[index];
          result.push(token.substring(index, nextEnd));
          index = nextEnd;
        }

        return result;
      }

      /**
       * コピー機能（フォールバック付き）
       */
      function copyResult() {
        const textArea = document.getElementById("targetText");
        const text = textArea.value;
        if (!text) return;

        // 新しいClipboard APIが使えるかチェック
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => setLog("翻訳結果をコピーしました。"))
            .catch((err) => {
              console.error(err);
              fallbackCopyText(textArea);
            });
        } else {
          // 使えない場合はdocument.execCommand('copy')にフォールバック
          fallbackCopyText(textArea);
        }
      }

      /**
       * execCommand('copy') フォールバック処理
       */
      function fallbackCopyText(textAreaElement) {
        let selection = null;
        let range = null;
        let wasReadOnly = false;
        try {
          // 現在の選択範囲を保存
          selection = document.getSelection();
          range =
            selection && selection.rangeCount > 0
              ? selection.getRangeAt(0)
              : null;

          // 一時的に編集可能にする（textarea が readonly なら外す）
          wasReadOnly = textAreaElement.hasAttribute("readonly");
          if (wasReadOnly) {
            textAreaElement.removeAttribute("readonly");
          }

          // テキストエリア内を全選択
          textAreaElement.select();

          // コピー実行
          const result = document.execCommand("copy");
          if (result) {
            setLog("翻訳結果をコピーしました。(fallback)");
          } else {
            setLog("コピーに失敗しました。(fallback)");
          }
        } catch (err) {
          setLog("コピーに失敗しました: " + err);
        } finally {
          // 選択範囲の復元
          if (selection) {
            try {
              selection.removeAllRanges();
              if (range) {
                selection.addRange(range);
              }
            } catch (err) {
              console.error(err);
            }
          }

          // 再度 readonly を付与
          if (wasReadOnly) {
            textAreaElement.setAttribute("readonly", true);
          }
        }
      }

      /**
       * ローディング表示の制御
       */
      function showLoading(isLoading) {
        loadingIndicator.style.display = isLoading ? "flex" : "none";
      }

      /**
       * ログをクリア
       */
      function clearLog() {
        document.getElementById("logArea").textContent = "";
      }

      /**
       * ログにメッセージを追記
       */
      function setLog(message) {
        const logArea = document.getElementById("logArea");
        if (logArea.textContent) {
          logArea.textContent += "\n" + message;
        } else {
          logArea.textContent = message;
        }
      }
    </script>
  </body>
</html>
