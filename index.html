<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>SCPタグ翻訳ツール</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* ベーススタイル */
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        line-height: 1.4;
        background-color: #f8f8f8;
        color: #333;
      }

      header {
        padding: 1rem;
        background-color: #f0f0f0;
        border-bottom: 1px solid #ccc;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
      }

      .container {
        width: 100%;
        max-width: 900px; /* ログ領域のはみ出しを防止 */
        margin: 0 auto;
        display: flex;
        flex-direction: row;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
      }

      .column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0; /* フレックス縮小時に要素がはみ出さないように */
      }

      label {
        font-weight: bold;
      }

      select {
        padding: 0.25rem;
        font-size: 0.9rem;
      }

      textarea {
        width: 100%;
        height: 8rem;
        box-sizing: border-box;
        resize: vertical;
        font-family: monospace;
        font-size: 0.95rem;
        padding: 0.5rem;
      }

      .buttons {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0.5rem 0;
      }

      .button {
        padding: 0.4rem 0.8rem;
        font-size: 0.9rem;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #f0f0f0;
      }

      /* ログ表示欄 */
      #logArea {
        width: 100%;
        height: 6rem;
        border: 1px solid #ccc;
        padding: 0.5rem;
        white-space: pre-wrap;
        overflow-y: auto;
        background-color: #f7f7f7;
        color: #444;
        box-sizing: border-box;
      }

      /* ローディング表示（テキスト＋アニメーション） */
      #loadingIndicator {
        display: none; /* 初期は非表示 */
        font-size: 0.95rem;
        color: #333;
        margin-top: 0.5rem;
        align-items: center;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 3px solid #ccc;
        border-top: 3px solid #66a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* ダークモード */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #222;
          color: #eee;
        }
        header,
        .container {
          background-color: #333;
        }
        select,
        textarea {
          background-color: #555;
          color: #eee;
          border: 1px solid #aaa;
        }
        .button {
          background-color: #444;
          color: #eee;
          border: 1px solid #aaa;
        }
        #logArea {
          background-color: #444;
          color: #ccc;
        }
        #loadingIndicator {
          color: #ccc;
        }
        .spinner {
          border: 3px solid #aaa;
          border-top: 3px solid #fff;
        }
      }

      /* 画面幅が狭い場合: 縦配置に切り替え */
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SCPタグ翻訳ツール</h1>
    </header>

    <!-- メインの2カラム: 翻訳元 / 翻訳先 -->
    <div class="container">
      <div class="column">
        <label for="sourceLang">翻訳元言語</label>
        <select id="sourceLang"></select>

        <textarea id="sourceText" placeholder="翻訳したいタグを入力"></textarea>
      </div>

      <div class="column">
        <label for="targetLang">コピー可能なJPタグ（そのまま使用可）</label>
        <select id="targetLang">
          <!-- 今は日本語(jp)のみ対応 -->
          <option value="jp" selected>日本語 (jp)</option>
          <!-- 将来的には以下を追加（コメントアウト中）
        <option value="en">English (en)</option>
        <option value="cn">中文 (cn)</option>
        <option value="cs">Česky (cs)</option>
        <option value="de">Deutsch (de)</option>
        <option value="es">Español (es)</option>
        <option value="fr">Français (fr)</option>
        <option value="it">Italiano (it)</option>
        <option value="ko">한국어 (ko)</option>
        <option value="pl">Polski (pl)</option>
        <option value="pt">Português (pt)</option>
        <option value="ru">Русский (ru)</option>
        <option value="th">ภาษาไทย (th)</option>
        <option value="ua">Українська (ua)</option>
        <option value="vn">Tiếng Việt (vn)</option>
        <option value="zh">繁體中文 (zh)</option>
        --></select>

        <textarea
          id="targetText"
          readonly
          placeholder="翻訳結果が表示されます"
        ></textarea>

        <div class="buttons">
          <!-- コピー ボタン -->
          <button class="button" id="btnCopy">コピー</button>
        </div>
      </div>
    </div>

    <!-- ログ表示欄 -->
    <div class="container" style="flex-direction: column">
      <div class="column">
        <label>要確認・コピー対象外ログ</label>
        <div id="logArea" aria-readonly="true"></div>

        <!-- ローディング表示エリア -->
        <div id="loadingIndicator">
          <div class="spinner"></div>
          <span>辞書を読み込んでいます...</span>
        </div>
      </div>
    </div>

    <script src="./branch_config.js"></script>
    <script id="app-script">
      "use strict";

      const supportedBranchConfigs = globalThis.SCP_TAG_TRANSLATION_BRANCHES;
      const sourceBranchTagByLang = Object.fromEntries(
        supportedBranchConfigs.map((config) => [config.branch, config.jp_branch_tag])
      );
      const jpBranchTags = new Set([
        "cn",
        "cs",
        "de",
        "el",
        "en",
        "es",
        "fr",
        "hu",
        "id",
        "int",
        "it",
        "jp",
        "ko",
        "kz",
        "nd",
        "pl",
        "pt",
        "ru",
        "sk",
        "th",
        "tr",
        "ua",
        "vn",
        "zh",
        "未認可支部",
      ]);

      const dictionaryCache = {}; // ペアごとの辞書キャッシュ
      const deprecatedCache = {}; // 非使用タグ置換辞書のキャッシュ
      const splitDictionaryIndexCache = new WeakMap();
      let jpPolicyCache = null; // JP登録タグの制限・翻訳緩和ポリシー
      let translationRequestId = 0; // 非同期fetchの古い結果を無視するための連番
      const loadingIndicator = document.getElementById("loadingIndicator");
      const hasOwn = (object, key) =>
        Object.prototype.hasOwnProperty.call(object, key);

      window.addEventListener("DOMContentLoaded", () => {
        renderSourceBranchOptions();
        setupUI();
        doTranslate(); // ページ読み込み時に1度実行
      });

      function renderSourceBranchOptions() {
        const sourceLang = document.getElementById("sourceLang");
        sourceLang.replaceChildren(
          ...supportedBranchConfigs.map((config) => {
            const option = document.createElement("option");
            option.value = config.branch;
            option.textContent = `${config.label} — ${config.site}`;
            option.selected = config.branch === "en";
            return option;
          })
        );
      }

      function setupUI() {
        document
          .getElementById("sourceLang")
          .addEventListener("change", doTranslate);
        document
          .getElementById("targetLang")
          .addEventListener("change", doTranslate);
        document
          .getElementById("sourceText")
          .addEventListener("input", doTranslate);
        document
          .getElementById("btnCopy")
          .addEventListener("click", copyResult);
      }

      function doTranslate() {
        const requestId = ++translationRequestId;
        clearLog();
        showLoading(true);

        const srcLang = document.getElementById("sourceLang").value;
        const tgtLang = document.getElementById("targetLang").value;
        const mapKey = `${srcLang}_to_${tgtLang}`;
        const inputStr = document.getElementById("sourceText").value.trim();

        if (!inputStr) {
          document.getElementById("targetText").value = "";
          showLoading(false);
          return;
        }

        // 非使用タグ置換辞書のfetch（キャッシュ済みでなければ）
        const deprecatedKey = `${mapKey}_deprecated`;
        const deprecatedUrl = `./dictionaries/deprecated_${mapKey}.json`;
        const deprecatedPromise = deprecatedCache[deprecatedKey]
          ? Promise.resolve(deprecatedCache[deprecatedKey])
          : fetch(deprecatedUrl)
              .then((res) => (res.ok ? res.json() : {}))
              .then((data) => {
                deprecatedCache[deprecatedKey] = data;
                return data;
              })
              .catch(() => {
                deprecatedCache[deprecatedKey] = {};
                return {};
              });

        const policyPromise = jpPolicyCache
          ? Promise.resolve(jpPolicyCache)
          : fetch("./dictionaries/jp_tag_policy.json")
              .then((res) => {
                if (!res.ok) {
                  throw new Error("JPタグポリシーを読み込めません");
                }
                return res.json();
              })
              .then((data) => {
                jpPolicyCache = data;
                return data;
              });

        // すでに読み込み済みかどうか
        if (dictionaryCache[mapKey]) {
          Promise.all([deprecatedPromise, policyPromise])
            .then(([deprecated, jpPolicy]) => {
              if (requestId !== translationRequestId) {
                return;
              }
              doTranslationWithDictionary(
                dictionaryCache[mapKey],
                inputStr,
                srcLang,
                deprecated,
                jpPolicy
              );
            })
            .catch((err) => {
              if (requestId !== translationRequestId) return;
              setLog(`【エラー】${err.message}`);
              document.getElementById("targetText").value = "";
            })
            .finally(() => {
              if (requestId === translationRequestId) showLoading(false);
            });
        } else {
          // 辞書ファイルをfetch
          const url = `./dictionaries/${mapKey}.json`;
          Promise.all([
            fetch(url)
              .then((res) => {
                if (!res.ok) {
                  throw new Error(`辞書ファイルがありません (${mapKey}.json)`);
                }
                return res.json();
              }),
            deprecatedPromise,
            policyPromise,
          ])
            .then(([data, deprecated, jpPolicy]) => {
              if (requestId !== translationRequestId) {
                return;
              }
              dictionaryCache[mapKey] = data;
              doTranslationWithDictionary(
                data,
                inputStr,
                srcLang,
                deprecated,
                jpPolicy
              );
            })
            .catch((err) => {
              if (requestId !== translationRequestId) {
                return;
              }
              const localFileNote =
                window.location.protocol === "file:"
                  ? "\nローカルファイルからはブラウザ制限により辞書JSONを読み込めません。GitHub PagesまたはローカルHTTPサーバーで開いてください。"
                  : "";
              setLog(
                `【エラー】未対応ペア (${mapKey}) です。辞書ファイル読み込みに失敗。${localFileNote}`
              );
              console.error(err);
              document.getElementById("targetText").value = "";
            })
            .finally(() => {
              if (requestId === translationRequestId) {
                showLoading(false);
              }
            });
        }
      }

      /**
       * 入力文字列を翻訳元タグへ分割する
       * @param {string} inputStr - ユーザー入力（タグ文字列）
       * @param {object} dictionary - 翻訳用辞書
       * @returns {string[]} 分割済みの翻訳元タグ
       */
      function tokenizeInputTags(
        inputStr,
        dictionary,
        concatenatedHints = {}
      ) {
        const tokens = inputStr.split(/\s+/);
        let allTags = [];

        tokens.forEach((token) => {
          if (hasOwn(dictionary, token)) {
            allTags.push(token);
          } else if (hasOwn(concatenatedHints, token)) {
            allTags = allTags.concat(concatenatedHints[token]);
          } else {
            allTags = allTags.concat(splitConcatenatedTags(token, dictionary));
          }
        });

        return allTags;
      }

      /**
       * 辞書データで実際の翻訳を行う
       * @param {object} dictionary - 翻訳用辞書
       * @param {string} inputStr - ユーザー入力（タグ文字列）
       * @param {string} srcLang - 翻訳元言語
       * @param {object} deprecatedDict - 非使用タグ置換辞書（省略可）
       * @param {object} jpPolicy - JPタグの制限・翻訳緩和ポリシー
       */
      function doTranslationWithDictionary(
        dictionary,
        inputStr,
        srcLang,
        deprecatedDict,
        jpPolicy
      ) {
        const concatenatedHints =
          (jpPolicy &&
            jpPolicy.concatenated_tag_hints &&
            jpPolicy.concatenated_tag_hints[srcLang]) ||
          {};
        const allTags = tokenizeInputTags(
          inputStr,
          dictionary,
          concatenatedHints
        );

        const translatedList = [];
        const replacedList = [];
        const omittedList = [];
        const applicationList = [];
        const unknownSourceList = [];
        const permissionList = [];
        const exemptedList = [];
        const policyErrorList = [];
        const appendTranslatedTag = (sourceTag, targetTag, prepend = false) => {
          const policyDataset = jpPolicy && jpPolicy.tags;
          const policy =
            policyDataset && hasOwn(policyDataset, targetTag)
              ? policyDataset[targetTag]
              : null;
          if (!policyDataset) {
            policyErrorList.push(
              `${sourceTag} → ${targetTag} (JPポリシーデータ未読込)`
            );
            return false;
          }
          if (!policy) {
            policyErrorList.push(`${sourceTag} → ${targetTag} (JPポリシー未収録)`);
            return false;
          }
          if (!policy.copy_allowed_for_translation) {
            if (policy.special_translation_action === "omit") {
              omittedList.push(
                `${sourceTag} → ${targetTag} (翻訳記事には付与しないタグ)`
              );
              return false;
            }
            const restriction =
              policy.special_translation_action === "staff_permission_required"
                ? "タグ固有の翻訳制限"
                : policy.edit_restricted
                  ? "編集禁止"
                  : "使用禁止・制限緩和/翻訳なし";
            permissionList.push(
              `${sourceTag} → ${targetTag} (${restriction})`
            );
            return false;
          }
          if (!translatedList.includes(targetTag)) {
            if (prepend) {
              translatedList.unshift(targetTag);
            } else {
              translatedList.push(targetTag);
            }
          }
          if (policy.use_restricted && policy.translation_exempt) {
            const note = `${sourceTag} → ${targetTag}`;
            if (!exemptedList.includes(note)) exemptedList.push(note);
          }
          return true;
        };

        allTags.forEach((tag) => {
          if (!hasOwn(dictionary, tag)) {
            unknownSourceList.push(
              `${tag} (未定義) → 未確認-${tag} (翻訳元の現在のタグとして未確認)`
            );
          } else if (dictionary[tag] === null) {
            const sourcePolicy =
              jpPolicy &&
              jpPolicy.source_tags &&
              jpPolicy.source_tags[srcLang] &&
              hasOwn(jpPolicy.source_tags[srcLang], tag)
                ? jpPolicy.source_tags[srcLang][tag]
                : null;
            if (deprecatedDict && hasOwn(deprecatedDict, tag)) {
              const replacement = deprecatedDict[tag];
              if (replacement) {
                // 置換先にもJP側の制限ポリシーを適用する。
                if (appendTranslatedTag(tag, replacement)) {
                  replacedList.push(`${tag} → ${replacement}`);
                }
              } else {
                omittedList.push(
                  `${tag} (未対応または非使用タグ) (JPでは付与しないタグ)`
                );
              }
            } else if (
              sourcePolicy &&
              (sourcePolicy.translation_action === "omit_jp_unused" ||
                sourcePolicy.translation_action === "omit_translation_policy")
            ) {
              const reason = sourcePolicy.reason
                ? `: ${sourcePolicy.reason}`
                : "";
              omittedList.push(
                `${tag} (未対応または非使用タグ) (JPでは付与しない${reason})`
              );
            } else {
              applicationList.push(
                `${tag} (未対応または非使用タグ) → 未訳-${tag} (JPタグリストに対応タグなし)`
              );
            }
          } else {
            appendTranslatedTag(tag, dictionary[tag]);
          }
        });

        // ---- 支部タグの追加（翻訳元言語をJP側タグとして含める）----
        // 入力タグから既に支部タグが得られた場合は、翻訳元支部タグを足さない。
        const sourceBranchTag = sourceBranchTagByLang[srcLang];
        const hasBranchTag = translatedList.some((tag) => jpBranchTags.has(tag));
        if (translatedList.length > 0 && sourceBranchTag && !hasBranchTag) {
          appendTranslatedTag(srcLang, sourceBranchTag, true);
        }

        document.getElementById("targetText").value = translatedList.join(" ");

        const logParts = [];
        if (replacedList.length > 0) {
          logParts.push(
            "【置換済み・コピー可能】\n" + replacedList.join("\n")
          );
        }
        if (exemptedList.length > 0) {
          logParts.push(
            "【制限緩和/翻訳によりコピー可能】\n" + exemptedList.join("\n")
          );
        }
        if (applicationList.length > 0) {
          logParts.push(
            "【タグ申請・確認が必要／コピー対象外】\n" +
              applicationList.join("\n")
          );
        }
        if (unknownSourceList.length > 0) {
          logParts.push(
            "【翻訳元タグ未確認／入力を確認・コピー対象外】\n" +
              unknownSourceList.join("\n")
          );
        }
        if (permissionList.length > 0) {
          logParts.push(
            "【スタッフ許可が必要／コピー対象外】\n" +
              permissionList.join("\n")
          );
        }
        if (omittedList.length > 0) {
          logParts.push(
            "【JPでは付与しない／コピー対象外】\n" + omittedList.join("\n")
          );
        }
        if (policyErrorList.length > 0) {
          logParts.push(
            "【データ不整合／コピー対象外】\n" + policyErrorList.join("\n")
          );
        }
        if (logParts.length > 0) {
          setLog(logParts.join("\n\n"));
        }
      }

      function splitConcatenatedTags(token, dictionary) {
        // 同じ辞書を使うたびに索引を作り直さないよう、prefix trieをキャッシュする
        let trieRoot = splitDictionaryIndexCache.get(dictionary);
        if (!trieRoot) {
          trieRoot = { children: new Map(), terminal: false };
          Object.keys(dictionary).forEach((key) => {
            let node = trieRoot;
            for (let index = 0; index < key.length; index++) {
              const character = key[index];
              let child = node.children.get(character);
              if (!child) {
                child = { children: new Map(), terminal: false };
                node.children.set(character, child);
              }
              node = child;
            }
            node.terminal = true;
          });
          splitDictionaryIndexCache.set(dictionary, trieRoot);
        }

        // 各位置で最長の辞書タグを優先しつつ、末尾まで分割できる候補を選ぶ
        const canSplit = Array(token.length + 1).fill(false);
        const nextEndByIndex = Array(token.length + 1).fill(-1);
        canSplit[token.length] = true;

        for (let index = token.length - 1; index >= 0; index--) {
          let node = trieRoot;
          let longestEnd = -1;
          for (let end = index; end < token.length; end++) {
            node = node.children.get(token[end]);
            if (!node) {
              break;
            }
            const candidateEnd = end + 1;
            if (node.terminal && canSplit[candidateEnd]) {
              longestEnd = candidateEnd;
            }
          }
          if (longestEnd !== -1) {
            canSplit[index] = true;
            nextEndByIndex[index] = longestEnd;
          }
        }

        if (!canSplit[0]) {
          return [token];
        }

        const result = [];
        for (let index = 0; index < token.length; ) {
          const nextEnd = nextEndByIndex[index];
          result.push(token.substring(index, nextEnd));
          index = nextEnd;
        }

        return result;
      }

      function copyResult() {
        const textArea = document.getElementById("targetText");
        const text = textArea.value;
        if (!text) return;

        // 新しいClipboard APIが使えるかチェック
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(text)
            .then(() => setLog("翻訳結果をコピーしました。"))
            .catch((err) => {
              console.error(err);
              fallbackCopyText(textArea);
            });
        } else {
          // 使えない場合はdocument.execCommand('copy')にフォールバック
          fallbackCopyText(textArea);
        }
      }

      function fallbackCopyText(textAreaElement) {
        let selection = null;
        let range = null;
        let wasReadOnly = false;
        try {
          // 現在の選択範囲を保存
          selection = document.getSelection();
          range =
            selection && selection.rangeCount > 0
              ? selection.getRangeAt(0)
              : null;

          // 一時的に編集可能にする（textarea が readonly なら外す）
          wasReadOnly = textAreaElement.hasAttribute("readonly");
          if (wasReadOnly) {
            textAreaElement.removeAttribute("readonly");
          }

          // テキストエリア内を全選択
          textAreaElement.select();

          // コピー実行
          const result = document.execCommand("copy");
          if (result) {
            setLog("翻訳結果をコピーしました。(fallback)");
          } else {
            setLog("コピーに失敗しました。(fallback)");
          }
        } catch (err) {
          setLog("コピーに失敗しました: " + err);
        } finally {
          // 選択範囲の復元
          if (selection) {
            try {
              selection.removeAllRanges();
              if (range) {
                selection.addRange(range);
              }
            } catch (err) {
              console.error(err);
            }
          }

          // 再度 readonly を付与
          if (wasReadOnly) {
            textAreaElement.setAttribute("readonly", true);
          }
        }
      }

      function showLoading(isLoading) {
        loadingIndicator.style.display = isLoading ? "flex" : "none";
      }

      function clearLog() {
        document.getElementById("logArea").textContent = "";
      }

      function setLog(message) {
        const logArea = document.getElementById("logArea");
        if (logArea.textContent) {
          logArea.textContent += "\n" + message;
        } else {
          logArea.textContent = message;
        }
      }
    </script>
  </body>
</html>
